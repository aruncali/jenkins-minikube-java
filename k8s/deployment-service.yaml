
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-application
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-application
  template:
    metadata:
      labels:
        app: java-application
    spec:
      containers:
        - name: java-application
          image: arunubuntu/java-application:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 1111
---
apiVersion: v1
kind: Service
metadata:
  name: java-application-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: java-application
  ports:
    - name: http
      port: 80
      targetPort: 1111
      nodePort: 30080
